name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install ./libs/contracts ./services/simulator ./services/stream-processor ./services/notifier

      - name: Lint (ruff)
        run: ruff check .

      - name: Format kontrolu (ruff)
        run: ruff format --check .

      - name: Tip kontrolu (domain, strict)
        run: mypy --strict services/stream-processor/src/stream_processor/domain

      - name: Birim testleri
        run: pytest -m unit
