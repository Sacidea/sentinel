[project]
name = "simulator"
version = "0.1.0"
description = "NASA IMS Dataset Simulator for Sentinel"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11.0,<0.12.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "libs-contracts",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
