[project]
name = "notifier"
version = "0.1.0"
description = "Anomaly notification service (Telegram) with circuit breaker"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11.0,<0.12.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "pybreaker>=1.2.0",
    "celery[redis]>=5.4.0",
    "libs-contracts",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
libs-contracts = { workspace = true }
