name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Kilidi kur
        run: uv sync --frozen --all-packages --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format kontrolu (ruff)
        run: uv run ruff format --check .

      - name: Tip kontrolu (domain, strict)
        run: uv run mypy --strict services/stream-processor/src/stream_processor/domain

      - name: pip-audit
        run: uv run pip-audit

      - name: Birim ve entegrasyon testleri
        run: uv run pytest -m "unit or integration"
