name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pydantic
          # servis bağımlılıkları için: pip install -e ./libs/contracts vb.

      - name: Lint (ruff)
        run: ruff check .

      - name: Format kontrolü (ruff)
        run: ruff format --check .

      - name: Tip kontrolü (mypy)
        run: mypy . || true    # başlangıçta uyarı; strict domain zorunlu olunca kaldır

      - name: Güvenlik denetimi (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true     # başlangıçta bilgilendirme amaçlı

      - name: Birim testleri
        run: pytest -m unit
