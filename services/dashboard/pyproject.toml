[project]
name = "dashboard"
version = "0.1.0"
description = "Optional FastAPI + WebSocket real-time dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "psycopg[binary]>=3.1.0",
    "libs-contracts",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
