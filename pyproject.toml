# Workspace geneli araç konfigürasyonu + uv kilit kökü.
# Servis bağımlılıkları kendi pyproject.toml'unda; bu dosya lint/type/test ve lock.

[project]
name = "sentinel"
version = "0.1.0"
description = "IMS vibration demo stack — lock root, not a published package"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pip-audit>=2.7.0",
]

[tool.uv.workspace]
members = [
    "libs/contracts",
    "services/simulator",
    "services/stream-processor",
    "services/notifier",
]

[tool.uv.sources]
libs-contracts = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E/F: pyflakes+pycodestyle, I: isort, N: pep8-naming, UP: pyupgrade,
# B: bugbear, C4: comprehensions, SIM: simplify, RUF: ruff-özel
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = [
    "libs/contracts/src",
    "services/simulator/src",
    "services/stream-processor/src",
    "services/notifier/src",
    "services/dashboard/src",
]
# domain katmanı için strict hedefi; infrastructure'da gerekirse override edilir.

[[tool.mypy.overrides]]
module = "*.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "river.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pybreaker.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services", "libs"]
pythonpath = [
    "libs/contracts/src",
    "services/simulator/src",
    "services/stream-processor/src",
    "services/notifier/src",
    "services/dashboard/src",
]
python_files = "test_*.py"
addopts = "-v --strict-markers --import-mode=importlib"
markers = [
    "unit: saf birim testleri (I/O yok)",
    "integration: servisler arasi (fake port veya dis bagimlilik)",
]
