services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sentinel-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescaledb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic sensor.vibration.raw --partitions 4 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic sensor.vibration.features --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic anomaly.detected --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic anomaly.dlq --partitions 1 --replication-factor 1

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: sensor.vibration.raw
      DATASET_PATH: ${DATASET_PATH:-/data/ims}
      DATASET_NAME: ${DATASET_NAME:-set2}
      PLAYBACK_INTERVAL_SEC: ${PLAYBACK_INTERVAL_SEC:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Host IMS kökü: Set 2 data/ims (veya ims/2nd_test), Set 1 data/ims_set1/1st_test.
      # Yaprak klasör DATASET_PATH ile seçilir (container içi yol).
      - ${IMS_DATA_PATH:-./data}:/data:ro

  stream-processor:
    build:
      context: .
      dockerfile: services/stream-processor/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW: sensor.vibration.raw
      KAFKA_TOPIC_ANOMALY: anomaly.detected
      KAFKA_TOPIC_DLQ: anomaly.dlq
      KAFKA_CONSUMER_GROUP: stream-processor-features
      TIMESCALE_DSN: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-CHANGE_ME}@timescaledb:5432/${POSTGRES_DB:-sentinel}
      PLAYBACK_INTERVAL_SEC: ${PLAYBACK_INTERVAL_SEC:-1.0}
      REASSEMBLY_MIN_CHUNKS_RATIO: ${REASSEMBLY_MIN_CHUNKS_RATIO:-0.5}
      REASSEMBLY_TIMEOUT_FLOOR: ${REASSEMBLY_TIMEOUT_FLOOR:-0.5}
      REASSEMBLY_TIMEOUT_FACTOR: ${REASSEMBLY_TIMEOUT_FACTOR:-1.5}
      MAX_PENDING_SNAPSHOTS: ${MAX_PENDING_SNAPSHOTS:-100}
      BASELINE_WINDOW: ${BASELINE_WINDOW:-200}
      MA_WINDOW: ${MA_WINDOW:-5}
      ANOMALY_ZSCORE_WARNING: ${ANOMALY_ZSCORE_WARNING:-5.0}
      ANOMALY_ZSCORE_CRITICAL: ${ANOMALY_ZSCORE_CRITICAL:-8.0}
      ALARM_COOLDOWN: ${ALARM_COOLDOWN:-60}
      ML_LAYER_ENABLED: ${ML_LAYER_ENABLED:-true}
      ML_WARNING_QUANTILE: ${ML_WARNING_QUANTILE:-0.995}
      ML_CRITICAL_QUANTILE: ${ML_CRITICAL_QUANTILE:-0.999}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_ANOMALY: anomaly.detected
      KAFKA_TOPIC_DLQ: anomaly.dlq
      KAFKA_CONSUMER_GROUP: notifier-alerts
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-CHANGE_ME}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-CHANGE_ME}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  notifier-worker:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    command: ["celery", "-A", "notifier.worker", "worker", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-CHANGE_ME}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-CHANGE_ME}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
  
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: sentinel-kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft mode (Zookeeper yok) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: sentinel-cluster-0000000001
      # --- Listeners: iç ağ + host ayrımı ---
      KAFKA_LISTENERS: INTERNAL://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- Tek node için gerekli ayarlar ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescale_data:
  kafka_data:
  grafana_data:
