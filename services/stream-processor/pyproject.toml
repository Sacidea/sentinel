[project]
name = "stream-processor"
version = "0.1.0"
description = "Vibration data stream processing, feature extraction, and anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11.0,<0.12.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "psycopg[binary]>=3.1.0",
    "scikit-learn>=1.5.0",
    "river>=0.21.0,<0.22.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.12.0",
    "libs-contracts",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
libs-contracts = { workspace = true }
